name: HL Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hl-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check
        env:
          HL_WALLET: "0x0c349d9b92fbd172bbb5a17a9db0a673a6a10ad3"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python hl_check.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain hl_state.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add hl_state.json
            git commit -m "update state"
            git push
          else
            echo "No state change."
          fi
